name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: 1660023456030f99770efb576b92fa3e684c6760
      role: typescript
      language: typescript
      checks: purity names parity
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
