name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: c2b4232e335fed6017dfd95f6a6b1370d3faa953
      role: typescript
      language: typescript
      checks: purity names parity
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
