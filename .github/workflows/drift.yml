name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: 6bd2497b149fb552a53f77834c8110e72faf570b
      role: typescript
      language: typescript
      checks: purity names parity layers
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
