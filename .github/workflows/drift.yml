name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: 74d8f3344bf31dc9c47f3a402130489896500a1d
      role: typescript
      language: typescript
      checks: purity names parity
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
