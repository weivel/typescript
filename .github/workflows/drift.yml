name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: 9af997e200141c898cae6d2dbc0467fd9691ff87
      role: typescript
      language: typescript
      checks: purity names parity
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
