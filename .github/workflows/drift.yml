name: Drift

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  drift:
    uses: intisy/workflows/.github/workflows/drift.yml@main
    with:
      kit_repository: weivel/conformance
      kit_ref: b027b360dee1213b0348cd42e98af6961c7ddd75
      role: typescript
      language: typescript
      checks: purity names parity
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
