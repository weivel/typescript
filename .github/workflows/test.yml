name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      cmake_version: '4.4.4'
      cmake_configure: ''
      cmake_build: ''
      cmake_test: ''
      node_install: npm ci
      node_build: npm run build
      node_test: npm test
    secrets:
      envPAT: ${{ secrets.PAT }}
